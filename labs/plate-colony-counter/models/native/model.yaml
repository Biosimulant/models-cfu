schema_version: '2.0'
package: cfu-visible-colony-inference
version: 0.3.1
title: CFU Visible Colony Counting
description: One uploaded plate image returns a count and inspectable original-frame
  detections using an immutable selected YOLOX-Tiny inference release. Scientific
  qualification failed its per-plate tail-error gate; experimental research assistance
  requires inspection of every detection. Actual upload parity and hosting remain
  pending.
standard: other
license: MIT
biosim:
  entrypoint: src.serving:CountVisibleColonies
  execution_policy: once_before_run
  communication_step: 0.01
parameters:
- name: contract_sha256
  value: 18deb9b8a8982f01cf4db749c5bbcdd4ec34af7dc681d9724017cb9ffd3cd794
- name: contract_size_bytes
  value: 6122
  min: 0
  max: 131072
- name: work_seconds
  value: 180
  min: 30
  max: 600
io:
  inputs:
  - name: image
    signal_type: scalar
    dtype: str
    value_type: file
    format: image
    description: Account-authorized retained JPEG/PNG; max20MiB and25million pixels.
  outputs:
  - name: count
    signal_type: scalar
    dtype: int
    emitted_unit: '1'
    description: Number of detected visible colonies; unit colonies; equal to the
      retained detections length.
  - name: receipt
    signal_type: record
    schema:
      stage: str
      count_unit: str
      input: json
      weights: json
      configuration: json
      detections: json
      environment: json
      inference_contract: json
      provenance: json
      seconds: float
      warnings: json
      annotated_image: json
    emitted_unit: '1'
  - name: annotated_path
    signal_type: scalar
    dtype: str
    value_type: file
    format: png
runtime:
  dependencies:
    packages:
    - biosimulant==0.0.34
    - torch==2.6.0
    - torchvision==0.21.0
    - numpy==1.26.4
    - Pillow==12.1.0
    - opencv-python-headless==4.10.0.84
    - loguru==0.7.3
    - psutil==7.0.0
    - packaging==24.2
    - tabulate==0.9.0
    - requests==2.32.5
    - shapely==2.1.1
    - tqdm==4.67.1
    - pybboxes==0.1.6
  remote:
    requirements:
      accelerator: gpu
