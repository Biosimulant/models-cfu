schema_version: '2.0'
package: cfu-adbc-acquisition
version: 0.1.0
title: Pinned ADBC Dataset Acquisition
description: Retain original publisher bytes and frozen image split identities in bounded batches.
standard: other
license: MIT
biosim:
  entrypoint: src.acquire:AcquireADBC
  execution_policy: once_before_run
  communication_step: 0.01
parameters:
- name: batch_index
  value: 0
  min: 0
  description: Exact immutable inventory batch to acquire.
io:
  inputs: []
  outputs:
  - name: archive_path
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
    description: Verified original files and their batch manifest.
  - name: manifest_path
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
    description: Source, hashes, license and original image splits.
