schema_version: '2.0'
package: cfu-adbc-duplicate-review
version: 0.1.1
title: ADBC Original Photograph Duplicate Review
description: Verify retained JPEG originals up to 40 million pixels and identify
  perceptual duplicate candidates before tiling; do not read held-out labels.
standard: other
license: MIT
biosim:
  entrypoint: src.review:ReviewADBC
  execution_policy: once_before_run
  communication_step: 0.01
io:
  inputs:
  - name: archive_0
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
    description: Retained checksum-pinned acquisition batch 0.
