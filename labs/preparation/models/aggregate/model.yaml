schema_version: '2.0'
package: cfu-whole-set-crop-verification
version: 0.1.0
title: ADBC Whole-set Prepared Crop Verification
description: Rehash six retained crop indexes and verify exact frozen training/validation
  coverage and cross-split crop byte identity. No accuracy claim.
standard: other
license: MIT
biosim:
  entrypoint: src.aggregate:VerifyWholeSet
  execution_policy: once_before_run
  communication_step: 0.01
io:
  inputs:
  - name: frozen_split
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: index_00
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: index_01
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: index_02
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: index_03
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: index_04
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: index_05
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  outputs:
  - name: receipt
    signal_type: record
    schema:
      stage: str
      summary: json
      verified_inputs: json
      effective_environment: json
      scientific_acceptance_established: bool
    emitted_unit: '1'
runtime:
  dependencies:
    packages:
    - biosimulant==0.0.34
