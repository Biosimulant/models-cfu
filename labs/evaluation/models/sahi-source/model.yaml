schema_version: '2.0'
package: cfu-sahi-source-inspection
version: 0.1.2
title: CFU SAHI Publisher Source Inspection
description: Retain publisher-pinned SAHI wheel/source/license before sliced inference,
  without executing third-party code.
standard: other
license: MIT
biosim:
  entrypoint: src.acquire:InspectSahiSource
  execution_policy: once_before_run
  communication_step: 0.01
io:
  inputs: []
  outputs:
  - name: receipt
    signal_type: record
    schema:
      stage: str
      package: str
      version: str
      provenance: json
      source_inspection_passed: bool
      license_observed: json
      required_source: json
      member_count: int
      third_party_code_executed: bool
    emitted_unit: '1'
  - name: source_archive_path
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: source_manifest_path
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
runtime:
  dependencies:
    packages:
    - biosimulant==0.0.34
