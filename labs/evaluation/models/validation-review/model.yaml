schema_version: '2.0'
package: cfu-original-validation-detection-review
version: 0.1.0
title: CFU Original Validation Detection Review
description: Render checksum-bound original validation photographs and saved detections
  into annotated images and an offline inspectable box viewer. No new inference, changed
  counts, test outcomes or release acceptance.
standard: other
license: MIT
biosim:
  entrypoint: src.review:RenderValidationReview
  execution_policy: once_before_run
  communication_step: 0.01
parameters:
- name: validation_origin_json
  value: ''
  description: Bounded metadata JSON independently read back through native account
    MCP, pinning comparison/prediction File IDs, sizes, hashes and originating Run/revision.
io:
